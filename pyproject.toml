[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantiqen-sdk"
version = "0.1.0"
description = "QUANTIQEN telemetry ingestion SDK for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "QUANTIQEN" },
]
keywords = ["quantiqen", "security", "telemetry", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/kalidashodekare14/quantiqen-sdk-python"
Repository = "https://github.com/kalidashodekare14/quantiqen-sdk-python"
Issues = "https://github.com/kalidashodekare14/quantiqen-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quantiqen_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
